- name: PBD TokenRouter Management API
  description: 'Administrative API for holders of a Management Key, covering API key
    listing/enable/disable, per-key spend quota, personal and organization wallet balances,
    and paginated or CSV usage-log export. Nine documented operations under the /api/management
    route group, each with its own published per-key rate-limit window.'
