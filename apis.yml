aid: palebluedotai
name: PaleBlueDot.AI
description: 'PaleBlueDot AI is a Palo Alto, California headquartered AI compute and
  intelligence platform that supplies GPU infrastructure, dedicated clusters and model
  access at scale. Its developer-facing product is PBD TokenRouter (www.tokenrouter.com),
  a unified AI model gateway that fronts 131 currently listed models from 22 vendors
  behind a single API key and four wire formats - OpenAI Chat Completions, OpenAI Responses,
  Anthropic Messages and Google Gemini generateContent - alongside image, audio and
  video generation endpoints. TokenRouter layers cross-provider routing and failover,
  prompt caching, per-key spend quotas, organization-level usage analytics and a stated
  Zero Data Retention policy on top of those models, and publishes a documented Management
  API for API key, quota, wallet and usage-log administration. The TokenRouter platform
  is operated by Artemis Tokenrouter Inc.'
