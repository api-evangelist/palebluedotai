apis:
- name: PBD TokenRouter Inference API
  description: 'OpenAI-, Anthropic- and Gemini-compatible inference gateway. One API
    key and one base URL route requests across 131 listed models from 22 vendors, with
    cross-provider failover, prompt caching and per-key spend quotas. Supported wire
    formats and their paths are published by the provider''s own anonymous /api/pricing
    endpoint: openai POST /v1/chat/completions, openai-response POST /v1/responses,
    anthropic POST /v1/messages, gemini POST /v1beta/models/{model}:generateContent,
    image-generation POST /v1/images/generations, video-generation POST /v1/video/generations.'
  humanURL: https://www.tokenrouter.com/docs/tokenrouter-feature-guide/
  baseURL: https://api.tokenrouter.com/v1
