  cause: The calling account has no org_id.
  remediation: Only enterprise super administrators may call the org endpoints.
- code: null
  http_status: 200
  message: key is required
  envelope: management
  cause: Empty key field in the request body.
  remediation: Send the full plaintext API key.
- code: null
  http_status: 200
  message: api key not found
  envelope: management
  cause: Key does not exist or does not belong to the calling account.
  remediation: Verify the key value and ownership.
- code: null
  http_status: 200
  message: remain_quota is required when not unlimited
  envelope: management
  cause: unlimited_quota was not true and remain_quota was omitted.
  remediation: Supply remain_quota, or set unlimited_quota true.
- code: null
  http_status: 200
  message: remain_quota must be >= 0
  envelope: management
  cause: Negative remain_quota.
  remediation: Send a non-negative quota amount.
- code: null
  http_status: 200
  message: member's email information is missing
  envelope: management
  cause: Empty email parameter on the member wallet endpoint.
  remediation: Supply the member email as a query parameter.
- code: null
  http_status: 200
  message: start_timestamp must not be later than end_timestamp
  envelope: management
  cause: Inverted time range on a usage query or export.
  remediation: Order the bounds correctly.
- code: null
  http_status: 200
  message: time range must not exceed 1 hour
  envelope: management
  cause: Usage query or export range wider than one hour.
  remediation: Page the range into one-hour windows.
- code: null
  http_status: 200
  message: The current requested page size is limited to 3000 items.
  envelope: management
  cause: page_size greater than 3000.
  remediation: Reduce page_size.
- code: ''
  http_status: 401
  message: 'Token not provided'
  type: api_error
  envelope: inference
  cause: No bearer token on an inference call.
  remediation: Send Authorization Bearer sk-...
  verified_live: true
- code: ''
  http_status: 404
  message: 'Invalid URL (GET /api/model/list)'
  type: invalid_request_error
  envelope: inference
  cause: Unrouted path on the gateway.
  remediation: Use a documented endpoint path.
  verified_live: true
- code: null
  http_status: 401
  message: invalid or missing API key
  type: authentication_error
  envelope: inference
  cause: Observed on the sibling gateway host api.palebluedot.ai for every path.
  remediation: Supply a valid key; this host exposes no anonymous surface at all.
  verified_live: true
soft_error_warning: >-
  IMPORTANT for agents: a large class of Management API errors is documented as being returned
  with HTTP 200 and success:false in the body, not with a 4xx status. The CSV export endpoint
  explicitly returns JSON errors "with HTTP 200 before the CSV stream begins". Status-code-only
  error handling will silently treat these failures as successes.
