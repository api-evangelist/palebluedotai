method: searched
source: https://www.tokenrouter.com/docs/management-api-documentation/
name: PaleBlueDot.AI / PBD TokenRouter error catalog
format: proprietary
rfc9457: false
rfc9457_note: >-
  No application/problem+json is served. Two distinct error envelopes coexist on the same
  host, which an agent must handle separately.
envelopes:
- id: management
  applies_to: /api/management/* (Management API)
  content_type: application/json
  shape: '{"success": false, "message": "<human readable>", "data": null}'
  machine_readable_code: false
  gap_note: >-
    Errors are distinguished only by an English prose message string plus the HTTP status.
    There is no stable symbolic error code, so an agent must string-match the message.
- id: inference
  applies_to: /v1/* (OpenAI/Anthropic/Gemini-compatible inference)
  content_type: application/json
  shape: '{"error": {"code": "", "message": "<human readable> (request id: <id>)", "type": "<type>", "param": ""}}'
  machine_readable_code: true
  code_note: >-
    Mirrors the OpenAI error envelope. The code field was observed empty on authentication
    failures; type carries the classification (api_error, invalid_request_error).
    The request id is interpolated into the message string rather than exposed as its own field.
errors:
- code: null
  http_status: 401
  message: No Authorization request header provided
  envelope: management
  cause: Missing Authorization header.
  remediation: Send Authorization Bearer <MANAGEMENT_KEY>.
  verified_live: true
- code: null
  http_status: 401
  message: management key is invalid
  envelope: management
  cause: Key not found or soft-deleted.
  remediation: Reissue a Management Key from the console.
- code: null
  http_status: 403
  message: management key has been disabled
  envelope: management
  cause: Key status is not enabled.
  remediation: Re-enable the key or issue a new one.
- code: null
  http_status: 403
  message: management key has expired
  envelope: management
  cause: Key is past its ExpiresTime.
  remediation: Issue a new Management Key.
- code: null
  http_status: 403
  message: User has been banned
  envelope: management
  cause: The owning user account is not enabled.
  remediation: Contact support@tokenrouter.com.
- code: null
  http_status: 429
  message: too many requests, please try again later
  envelope: management
  cause: Per-endpoint sliding-window limit reached for this management key.
  remediation: Back off and retry; limits are per (management_key_id, endpoint). No Retry-After header is sent.
- code: null
  http_status: 200
  message: you are not currently an enterprise super administrator
