attribution_warning: >-
  READ THIS BEFORE CITING THE CERTIFICATIONS. None of the certifications above belong to
  PaleBlueDot AI. The company's own wording is explicit: "Data Center & Facility Compliance
  (Provided by Digital Realty) - Our primary colocation facilities are provided by Digital Realty.
  These facilities are certified and maintained under the ISO/IEC 27001 Information Security
  Management System, and backed by SOC 2 / SOC 3 reports covering physical infrastructure and
  facility operations." These are the LANDLORD'S facility certifications, inherited by tenancy.
  No company-level, platform-level or software-level audit of PaleBlueDot AI or of the TokenRouter
  gateway is claimed or published. Recording these as PaleBlueDot certifications would be a
  misattribution of the same class the catalogue has been burned by before.
