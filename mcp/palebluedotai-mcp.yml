candidate_tools_note: >-
  A candidate tool list has deliberately NOT been derived. The pipeline permits deriving candidates
  from an OpenAPI document, and this provider publishes none - the Management API is described only
  in prose, so any tool schemas would be transcription rather than derivation. The nine documented
  Management API operations in errors/ and data-model/ are the natural basis should the provider
  ever ship a server.
tool_crosswalk:
