finding: >-
  PaleBlueDot AI ships NO MCP server - neither a remote endpoint nor a local stdio package.
  This is a notable gap for an agent-infrastructure company: TokenRouter's own documentation is
  built around agent clients (Claude Code, Codex/ChatGPT, OpenClaw, ZCode), and the company markets
  a "Dot-1.1 AI Cloud Agent", yet the platform exposes no MCP surface of its own. No type MCPServer
  pointer is emitted in apis.yml, because emitting one would assert an agent surface that does not exist.
