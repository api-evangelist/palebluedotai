id_conventions:
- surface: API keys
  prefix: sk-
  note: Keys are both the credential and the addressing identifier on write operations, so a rotation changes the object's identity.
- surface: Requests
  field: request_id
  note: The single join key between a response header, an error message string and a usage-log row.
- surface: Money
  note: All monetary values are raw quota units divided by QuotaPerUnit (500000 per USD, published by /api/status). Read-side rounding differs by endpoint - 6 decimal places per record, 4 for a range total.
modelling_observations:
- The API returns its own field legends inline (status_tips, unlimited_tips, expired_time_tips) rather than documenting enums in a schema - unusual, and helpful to an agent reading a raw response.
- There is no customer, project or environment entity; the account/organization pair is the only tenancy boundary.
- Usage data is only queryable in one-hour windows, so UsageLogEntry has no practical long-range aggregate surface.
