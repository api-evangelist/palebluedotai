  - {name: status_tips, type: string, description: Self-describing legend for status, returned inline}
  - {name: unlimited_quota, type: boolean, description: When true the key has no spend limit}
  - {name: unlimited_tips, type: string, description: Self-describing legend for unlimited_quota}
  - {name: remain_quota, type: number, description: Remaining spendable amount (raw quota / QuotaPerUnit)}
  - {name: used_quota, type: number, description: Amount already consumed}
  - {name: expired_time, type: integer, description: '-1 = never expires, otherwise a UTC epoch second'}
  - {name: expired_time_tips, type: string, description: Self-describing legend for expired_time}
