name: PaleBlueDot.AI / PBD TokenRouter client packages
official_package_count: 0
finding: >-
  NO first-party client library was found for PaleBlueDot AI or PBD TokenRouter on any registry.
  The documented integration path is configuration rather than a package: developers point an
  existing OpenAI, Anthropic or Gemini client at https://api.tokenrouter.com/v1 (or
  https://api.tokenrouter.com for Anthropic Messages) and supply an sk- key. Because the gateway
  is wire-compatible with three major vendor APIs, those vendors' own SDKs are the de facto client
  libraries and TokenRouter ships none of its own.
namesake_warning: >-
  CRITICAL - DO NOT ATTRIBUTE. The npm package "tokenrouter" and the PyPI package "tokenrouter"
  both describe themselves as the "Official SDK for TokenRouter - the OpenAI-compatible AI gateway",
  but they belong to a DIFFERENT company. Their own metadata points at tokenrouter.io, not
  PaleBlueDot's tokenrouter.com: the npm maintainer is tokenrouter-admin <support@tokenrouter.io>,
  the README links to https://tokenrouter.io, and the PyPI project_urls give Homepage
  https://tokenrouter.io and Documentation https://docs.tokenrouter.io. PaleBlueDot AI's own
  documentation never references either package, and its own GitHub organisation is
  TokenRouter-Tools. These packages were checked and REJECTED; recording them as first-party would
  credit PaleBlueDot with SDKs it does not publish.
