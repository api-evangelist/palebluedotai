- id: openai-images-generations
  label: OpenAI image generation wire format
  conforms: true
  category: domain-standard
  evidence: 'supported_endpoint.image-generation = {path: /v1/images/generations, method: POST}; 4 catalogued models declare it.'
  source: https://api.tokenrouter.com/api/pricing
- id: bearer-token-auth
  label: HTTP Bearer authentication (RFC 6750)
  conforms: true
  category: cross-cutting
  evidence: Authorization Bearer on both the inference and management surfaces; live 401 confirms header requirement.
