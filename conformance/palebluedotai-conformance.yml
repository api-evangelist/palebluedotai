name: PaleBlueDot.AI / PBD TokenRouter conformance
note: >-
  Cross-cutting and domain standards asserted for the TokenRouter gateway. Every entry
  cites the exact surface it was read from. Entries marked conforms false are recorded as
  honest absences, not as penalties.
standards:
- id: openai-chat-completions
  label: OpenAI Chat Completions wire format
  conforms: true
  category: domain-standard
  evidence: >-
    The provider's own anonymous https://api.tokenrouter.com/api/pricing response declares
    supported_endpoint.openai = {path: /v1/chat/completions, method: POST}, and 87 of the 132
    catalogued models list "openai" in supported_endpoint_types. The OpenClaw setup guide
    instructs users to select "OpenAI-compatible (/chat/completions)" with base URL
    https://api.tokenrouter.com/v1.
  source: https://www.tokenrouter.com/docs/openclaw-setup/
- id: openai-responses
  label: OpenAI Responses API wire format
  conforms: true
  category: domain-standard
  evidence: 'supported_endpoint.openai-response = {path: /v1/responses, method: POST}; 13 catalogued models declare it.'
  source: https://api.tokenrouter.com/api/pricing
- id: anthropic-messages
  label: Anthropic Messages API wire format
  conforms: true
  category: domain-standard
  evidence: >-
    supported_endpoint.anthropic and supported_endpoint.anthropic-compatible both =
    {path: /v1/messages, method: POST}; 16 catalogued models declare one of the two. The Claude
    Code setup guide sets ANTHROPIC_BASE_URL=https://api.tokenrouter.com and notes the client
    will request /v1/messages itself.
  source: https://www.tokenrouter.com/docs/claude-code-setup/
- id: google-gemini-generatecontent
  label: Google Gemini generateContent wire format
  conforms: true
  category: domain-standard
