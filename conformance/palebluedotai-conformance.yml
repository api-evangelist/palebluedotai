domain_standard:
  market: LLM inference gateway / AI model aggregation
  formal_standards_body: none
  formal_standards_body_note: >-
    This market has no formal domain standard (no SCIM/OData/HL7 equivalent). Its de-facto
    interoperability standards are the vendor wire formats above, and TokenRouter declares
    conformance to five of them in a machine-readable form served without authentication.
    Recorded as reward-only; nothing has been invented to fill the slot.
  declared_in_contract: true
  declaration_surface: https://api.tokenrouter.com/api/pricing (supported_endpoint block)
